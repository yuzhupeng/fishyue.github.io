# Site Information
title: fishyue
description: "由奢入俭难，由俭入奢易"
url: https://blog.yuzhupeng.top
repo: yuzhupeng/fishyue.github.io
lang: zh-CN
encoding: utf-8
timezone: Asia/Shanghai

# Author Information (for SEO and AI crawlers)
author:
  name: fishyue
  email: a3363196@gmail.com
  url: https://blog.yuzhupeng.top
  twitter: ""
  github: yuzhupeng

# Social Media and External URLs
github: yuzhupeng
zhihu: ""
twitter: ""
v2ex: ""
menu:
  - title: "博客"
    url: "/posts/"
  - title: "短记"
    url: "/notes/"
  - title: "关于"
    url: "/about.html"

# SEO and Analytics
google_analytics: ""

# Build Settings
paginate: 10
post_ext: md
page_ext: md
post_layout: post
page_layout: page
titlecase: true
future: true
highlighter: rouge
markdown: kramdown
permalink: /post/:title/
sass:
  sass_dir: _sass
  style: compressed

webrick:
  headers:
    "Access-Control-Allow-Origin": "*"
    "Access-Control-Allow-Methods": "GET, OPTIONS"
    "Access-Control-Allow-Headers": "Content-Type, X-Requested-With"

collections:
  posts:
    output: true
    permalink: /post/:title/
  posts_en:
    output: true
    permalink: /en/post/:title/
    sort_by: date

# `.well-known` is a dot-directory, so Jekyll skips it unless it is listed here.
include: [".htaccess", "robots.txt"]
exclude:
  [
    "Gemfile",
    "Gemfile.lock",
    "README.md",
    "AGENTS.md",
    "LICENSE",
    "package.json",
    "node_modules",
    "SEO_GUIDE.md",
    "data",
    "scripts",
    "tests",
    "docs",
  ]

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-pdf-embed
  - jekyll-sitemap
  - jekyll-feed

# Sitemap Settings
defaults:
  - scope:
      path: "images/**/*"
    values:
      sitemap: false
  - scope:
      path: "js/**/*"
    values:
      sitemap: false
  - scope:
      path: "css/**/*"
    values:
      sitemap: false
  - scope:
      path: "_sass/**/*"
    values:
      sitemap: false
  - scope:
      path: "files/share/agent.html"
    values:
      sitemap: false
  - scope:
      path: "github.html"
    values:
      sitemap: false
  - scope:
      path: ""
      type: "posts"
    values:
      sitemap:
        priority: 0.8
        changefreq: weekly
  - scope:
      path: ""
      type: "posts_en"
    values:
      lang: en-US
      sitemap:
        priority: 0.8
        changefreq: weekly
  - scope:
      path: ""
      type: "pages"
    values:
      sitemap:
        priority: 0.6
        changefreq: monthly

# Custom Site Settings
showBuyCoffee: false
# Email signup under each post, served by weekly.tw93.fun/api/subscribe.
# Turn on only after a real signup and test send went through.
newsletter: false
payImage: ""
assetUrl: ""
defaultImage: data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==
